name: Star History

on:
  schedule:
    - cron: "17 */12 * * *"   # 每 12 小时（避开整点高峰）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成 Star History SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/gen-star-history.py
      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history-*.svg
          if git diff --cached --quiet; then
            echo "曲线无变化，跳过提交"
          else
            git commit -m "chore: 更新 Star History 曲线"
            git push
          fi
